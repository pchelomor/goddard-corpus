name: Fix editorial journal L0076-L0085

"on":
  push:
    paths:
      - '.github/workflows/fix-journal-l0076-l0085.yml'

permissions:
  contents: write

jobs:
  fix-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct batch text and remove one-shot workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('EDITORIAL_JOURNAL.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('`L0078` intentionally produces **4 SELECT**.', '`L0078` intentionally produces **0 SELECT**.')
          s = s.replace('`L0079` intentionally produces **4 SELECT**.', '`L0079` intentionally produces **0 SELECT**.')
          s = s.replace('`L0081` intentionally produces **4 SELECT**.', '`L0081` intentionally produces **0 SELECT**.')
          s = s.replace('`L0080| contributes', '`L0080` contributes')
          s = s.replace('`L0080| uses', '`L0080` uses')
          s = s.replace('`L0083` intentionally produces **0 SELECT** it is', '`L0083` intentionally produces **0 SELECT**. It is')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-journal-l0076-l0085.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EDITORIAL_JOURNAL.md .github/workflows/fix-journal-l0076-l0085.yml
          git commit -m "journal: fix L0076-L0085 batch text"
          git push
