name: Append editorial journal L0096-L0105
on:
  push:
    paths:
      - '.github/workflows/append-journal-l0096-l0105.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append batch record and self-delete
        shell: bash
        run: |
          printf '%s' '' | base64 --decode >> EDITORIAL_JOURNAL.md
          git rm .github/workflows/append-journal-l0096-l0105.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EDITORIAL_JOURNAL.md
          git commit -m 'editorial: journal L0096-L0105'
          git push
