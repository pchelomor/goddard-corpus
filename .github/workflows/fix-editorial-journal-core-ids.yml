name: Fix editorial journal core IDs

on:
  push:
    paths:
      - '.github/workflows/fix-editorial-journal-core-ids.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize B001 B004 B005 labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('EDITORIAL_JOURNAL.md')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '| B001 | Feeling Is the Secret |': '| B004 | Feeling Is the Secret |',
              '| B004 | Prayer, The Art Of Believing |': '| B005 | Prayer, The Art Of Believing |',
              '| B005 | At Your Command |': '| B001 | At Your Command |',
              '- `B001` Feeling Is the Secret —': '- `B004` Feeling Is the Secret —',
              '- `B004` Prayer, The Art Of Believing —': '- `B005` Prayer, The Art Of Believing —',
              '- `B005` At Your Command —': '- `B001` At Your Command —',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected journal text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit correction and remove transient workflow
        shell: bash
        run: |
          rm .github/workflows/fix-editorial-journal-core-ids.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EDITORIAL_JOURNAL.md .github/workflows/fix-editorial-journal-core-ids.yml
          git diff --cached --check
          git commit -m 'Align editorial journal core IDs with corpus registry'
          git push origin HEAD:main
