name: Reorder editorial journal core audit

on:
  push:
    paths:
      - '.github/workflows/reorder-editorial-journal-core.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reorder B audit and historical bullets
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('EDITORIAL_JOURNAL.md')
          s = p.read_text(encoding='utf-8')

          # Reorder B001-B014 rows in the B/S priority audit, preserving S rows after them.
          start = s.index('## B/S priority audit')
          end = s.index('\n**B008 status:**', start)
          block = s[start:end]
          lines = block.splitlines()
          b_rows = {}
          other = []
          for line in lines:
              m = re.match(r'\| (B\d{3}) \|', line)
              if m:
                  b_rows[m.group(1)] = line
              else:
                  other.append(line)
          if set(b_rows) != {f'B{i:03d}' for i in range(1,15)}:
              raise SystemExit(f'unexpected B row set: {sorted(b_rows)}')
          first_b = next(i for i,l in enumerate(lines) if re.match(r'\| B\d{3} \|', l))
          last_b = max(i for i,l in enumerate(lines) if re.match(r'\| B\d{3} \|', l))
          new_lines = lines[:first_b] + [b_rows[f'B{i:03d}'] for i in range(1,15)] + lines[last_b+1:]
          s = s[:start] + '\n'.join(new_lines) + s[end:]

          # Reorder historical B001-B014 bullets while leaving supplementary bullets after them.
          hstart = s.index('## 2026-08-31 — Historical completed core passes')
          hend = s.index('\nRaw candidate, rejected', hstart)
          hblock = s[hstart:hend]
          hlines = hblock.splitlines()
          hb = {}
          for line in hlines:
              m = re.match(r'- `B(\d{3})` ', line)
              if m:
                  hb[f'B{m.group(1)}'] = line
          expected = {f'B{i:03d}' for i in list(range(1,8)) + list(range(9,15))}
          if set(hb) != expected:
              raise SystemExit(f'unexpected historical B bullets: {sorted(hb)}')
          first_hb = next(i for i,l in enumerate(hlines) if re.match(r'- `B\d{3}` ', l))
          last_hb = max(i for i,l in enumerate(hlines) if re.match(r'- `B\d{3}` ', l))
          ordered_ids = [f'B{i:03d}' for i in list(range(1,8)) + list(range(9,15))]
          new_hlines = hlines[:first_hb] + [hb[x] for x in ordered_ids] + hlines[last_hb+1:]
          s = s[:hstart] + '\n'.join(new_hlines) + s[hend:]

          p.write_text(s, encoding='utf-8')
      - name: Commit reorder and remove transient workflow
        shell: bash
        run: |
          rm .github/workflows/reorder-editorial-journal-core.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EDITORIAL_JOURNAL.md .github/workflows/reorder-editorial-journal-core.yml
          git diff --cached --check
          git commit -m 'Order editorial journal core audit by corpus ID'
          git push origin HEAD:main
