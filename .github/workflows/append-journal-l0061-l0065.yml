name: Append editorial journal L0061-L0065

on:
  push:
    paths:
      - '.github/workflows/append-journal-l0061-l0065.yml'

permissions:
  contents: write

jobs:
  append-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append batch record and remove one-shot workflow
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> EDITORIAL_JOURNAL.md
          rm -f .github/workflows/append-journal-l0061-l0065.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EDITORIAL_JOURNAL.md .github/workflows/append-journal-l0061-l0065.yml
          git commit -m "journal: record L0061-L0065 editorial batch"
          git push
