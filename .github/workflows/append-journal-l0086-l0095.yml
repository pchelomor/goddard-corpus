name: Append editorial journal L0086-L0095
on:
  push:
    paths:
      - '.github/workflows/append-journal-l0086-l0095.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified batch record
        shell: bash
        run: |
          echo '' | base64 -d >> EDITORIAL_JOURNAL.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EDITORIAL_JOURNAL.md
          git commit -m 'journal: record L0086-L0095 editorial batch'
          git push
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/append-journal-l0086-l0095.yml
          git commit -m 'chore: remove L0086-L0095 journal workflow'
          git push
